# #   * every call runs in its own transaction that is ALWAYS rolled back;
# #   * both procedures and every routine they call were reviewed on 2026-11-12 and write only to
# #     temp tables (#CockpitData, temp_cockpit_*, temp_shift_details). `reviewed` holds the SHA-256 of
# #     each reviewed definition; if any definition on the server differs, the whole run is refused
# #     until it is re-reviewed and the hash updated here (or this table is left out of the run).
# #
# # Every column the procedures return is accounted for: the 30 SQL Server columns are compared with
# # their Postgres counterparts; the Postgres-only columns are shown (info) and listed under
# # not_compared. A newly returned, unmapped column is reported as a finding.
